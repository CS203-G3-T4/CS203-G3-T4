name: CI

# Runs the project's existing automated tests on every pull request to main and
# on every push to main. It runs whatever tests the repository contains, so a new
# feature is only covered if its PR adds tests (see the PR template's Validation
# section). There is no deployment step: Railway deploys main itself
# (see docs/deployment.md).
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

# Stop superseded runs for the same PR/branch.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  java:
    name: Java tests (with PostgreSQL)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: wattly_test
          POSTGRES_DB: postgres
          # Throwaway CI database only; never reachable outside the job.
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U wattly_test -d postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      # Enables the database-backed tests that are skipped when this is unset.
      WATTLY_TEST_DB_URL: jdbc:postgresql://localhost:5432/postgres
      WATTLY_TEST_DB_USER: wattly_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Run Java tests
        run: ./mvnw -B -ntp test

  frontend:
    name: JavaScript tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run JavaScript tests
        run: node --test src/test/js/*.test.js

  # The Python suite took ~13.5 min in one job, about half of it in three study
  # tests. It runs as parallel shards instead; each shard has its own PostgreSQL.
  # The shard map is defined ONCE, in the "shards" job below. The matrix and the
  # "rest" ignore list are both derived from it, so they cannot drift apart.
  # "rest" runs every test file not named by another shard, so new test files
  # are always covered. Rebalance with `pytest --durations=25` if one shard grows.
  shards:
    name: Python test shards
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      matrix: ${{ steps.map.outputs.matrix }}
      sharded: ${{ steps.map.outputs.sharded }}
    steps:
      - id: map
        name: Define shard map
        run: |
          # The only place shards are listed. Edit here; "rest" is added below.
          shard_map='[
            {"name": "corrections", "files": ["test_corrections.py"]},
            {"name": "retraining",  "files": ["test_retraining.py"]},
            {"name": "stability",   "files": ["test_stability.py"]},
            {"name": "studies",     "files": ["test_ts_variants.py", "test_experiments.py",
                                              "test_improvement.py", "test_timeseries.py",
                                              "test_portable_weekly.py"]}
          ]'
          matrix=$(jq -c '{shard: (map({name, files: (.files | join(" "))}) + [{name: "rest", files: ""}])}' <<<"$shard_map")
          sharded=$(jq -r '[.[].files[]] | join(" ")' <<<"$shard_map")
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          echo "sharded=$sharded" >> "$GITHUB_OUTPUT"
          echo "matrix=$matrix"
          echo "sharded=$sharded"

  python:
    name: Python tests (${{ matrix.shard.name }})
    needs: shards
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.shards.outputs.matrix) }}
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: wattly_test
          POSTGRES_DB: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U wattly_test -d postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      WATTLY_WEEKLY_TEST_DATABASE_URL: postgresql://wattly_test@localhost:5432/postgres
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      SHARD_FILES: ${{ matrix.shard.files }}
      # Derived from the "shards" job; "rest" ignores every sharded file.
      SHARDED_FILES: ${{ needs.shards.outputs.sharded }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            ml/requirements.lock
            ml/requirements-server.lock
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Install pinned dependencies
        run: |
          python -m pip install -r ml/requirements-server.lock
          python -m pip install --no-deps --no-build-isolation -e ml
      - name: Run Python tests
        run: |
          set --
          if [ -n "$SHARD_FILES" ]; then
            for f in $SHARD_FILES; do set -- "$@" "ml/tests/$f"; done
          else
            set -- ml/tests
            echo "rest shard ignores (run by other shards):"
            for f in $SHARDED_FILES; do
              test -f "ml/tests/$f" || { echo "Missing sharded file $f"; exit 1; }
              echo "  $f"
              set -- "$@" "--ignore=ml/tests/$f"
            done
          fi
          python -m pytest -q "$@"

  weekly-container:
    name: Portable weekly container
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: wattly_test
          POSTGRES_DB: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U wattly_test -d postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Build pinned non-root weekly image
        run: docker build -f ml/Dockerfile.weekly -t wattly-weekly:ci ml
      - name: Exercise worker, source adapters and audit contract in the image
        run: |
          docker run --rm --read-only --network host --cpus 1 --memory 2g \
            --cap-drop ALL --security-opt no-new-privileges \
            --tmpfs /tmp:rw,nosuid,nodev,size=268435456 \
            -e WATTLY_WEEKLY_TEST_DATABASE_URL=postgresql://wattly_test@127.0.0.1:5432/postgres \
            -v "$PWD/ml/tests:/opt/wattly-ml/tests:ro" \
            --entrypoint python wattly-weekly:ci -m pytest -q -p no:cacheprovider \
            --basetemp /tmp/pytest tests/test_portable_weekly.py tests/test_weekly_postgres.py

  evidence:
    name: Frozen research archive
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Rebuild and verify frozen evidence
        run: |
          mkdir -p forecast-artifacts
          python3 scripts/forecast-artifacts.py build forecast-artifacts/wattly-forecast-evidence-0b73a58.tar.gz
          python3 scripts/forecast-artifacts.py verify forecast-artifacts/wattly-forecast-evidence-0b73a58.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: wattly-forecast-evidence-0b73a58
          path: |
            forecast-artifacts/wattly-forecast-evidence-0b73a58.tar.gz
            docs/forecasting/artifacts.json
          retention-days: 30

  # One stable check name for the branch ruleset to require, so job names can
  # change later without editing the ruleset.
  ci-passed:
    name: CI passed
    if: always()
    needs: [java, frontend, shards, python, evidence, weekly-container]
    runs-on: ubuntu-latest
    steps:
      - name: Require every job to succeed
        run: |
          echo "java=${{ needs.java.result }} frontend=${{ needs.frontend.result }} python=${{ needs.python.result }}"
          test "${{ needs.evidence.result }}" = "success"
          test "${{ needs.weekly-container.result }}" = "success"
          test "${{ needs.java.result }}" = "success"
          test "${{ needs.frontend.result }}" = "success"
          test "${{ needs.shards.result }}" = "success"
          test "${{ needs.python.result }}" = "success"
