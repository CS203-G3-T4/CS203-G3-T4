name: CI

# Runs the project's existing automated tests on every pull request to main and
# on every push to main. It runs whatever tests the repository contains, so a new
# feature is only covered if its PR adds tests (see the PR template's Validation
# section). There is no deployment step: the project is not deployed.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

# Stop superseded runs for the same PR/branch.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  java:
    name: Java tests (with PostgreSQL)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: wattly_test
          POSTGRES_DB: postgres
          # Throwaway CI database only; never reachable outside the job.
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U wattly_test -d postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      # Enables the database-backed tests that are skipped when this is unset.
      WATTLY_TEST_DB_URL: jdbc:postgresql://localhost:5432/postgres
      WATTLY_TEST_DB_USER: wattly_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
      - name: Run Java tests
        run: ./mvnw -B -ntp test

  frontend:
    name: JavaScript tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run JavaScript tests
        run: node --test src/test/js/*.test.js

  python:
    name: Python tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ml/requirements.lock
      - name: Install pinned dependencies
        run: |
          python -m pip install -r ml/requirements.lock
          python -m pip install --no-deps --no-build-isolation -e ml
      - name: Run Python tests
        run: python -m pytest -q ml/tests

  evidence:
    name: Frozen research archive
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Rebuild and verify frozen evidence
        run: |
          mkdir -p forecast-artifacts
          python3 scripts/forecast-artifacts.py build forecast-artifacts/wattly-forecast-evidence-76c4866.tar.gz
          python3 scripts/forecast-artifacts.py verify forecast-artifacts/wattly-forecast-evidence-76c4866.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: wattly-forecast-evidence-76c4866
          path: |
            forecast-artifacts/wattly-forecast-evidence-76c4866.tar.gz
            docs/forecasting/artifacts.json
          retention-days: 30

  # One stable check name for the branch ruleset to require, so job names can
  # change later without editing the ruleset.
  ci-passed:
    name: CI passed
    if: always()
    needs: [java, frontend, python, evidence]
    runs-on: ubuntu-latest
    steps:
      - name: Require every job to succeed
        run: |
          echo "java=${{ needs.java.result }} frontend=${{ needs.frontend.result }} python=${{ needs.python.result }}"
          test "${{ needs.evidence.result }}" = "success"
          test "${{ needs.java.result }}" = "success"
          test "${{ needs.frontend.result }}" = "success"
          test "${{ needs.python.result }}" = "success"
