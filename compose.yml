services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: energy_market
      POSTGRES_USER: energy_market
      POSTGRES_PASSWORD: energy_market
    ports:
      - "${POSTGRES_PORT:-55432}:5432"
    volumes:
      - market_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U energy_market -d energy_market"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  market_postgres_data:
