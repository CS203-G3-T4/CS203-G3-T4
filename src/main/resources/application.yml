spring:
  application:
    name: energy-market-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:55432/energy_market}
    username: ${DB_USER:energy_market}
    password: ${DB_PASSWORD:energy_market}
  flyway:
    enabled: true

market:
  feed:
    url: ${USEP_FEED_URL:https://nems.sn.sg/api/status.json}
    enabled: ${USEP_POLLING_ENABLED:true}
    cron: ${USEP_POLL_CRON:0 2,32 * * * *}
    connect-timeout: 3s
    read-timeout: 5s
    stale-after: 40m

management:
  endpoints:
    web:
      exposure:
        include: health,info

weather:
  feed:
    url: ${NEA_FEED_URL:https://api-open.data.gov.sg/v2/real-time/api/two-hr-forecast}
  daily:
    url: ${NEA_DAILY_FEED_URL:https://api-open.data.gov.sg/v2/real-time/api/twenty-four-hr-forecast}
    enabled: ${NEA_DAILY_POLLING_ENABLED:${USEP_POLLING_ENABLED:true}}
    cron: ${NEA_DAILY_POLL_CRON:0 5 */3 * * *}
    stale-after: 6h
    heat-threshold-c: ${WEATHER_HEAT_THRESHOLD_C:33}
