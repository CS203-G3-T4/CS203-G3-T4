spring:
  application:
    name: energy-market-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:55432/energy_market}
    username: ${DB_USER:energy_market}
    password: ${DB_PASSWORD:energy_market}
  flyway:
    enabled: true

market:
  feed:
    url: ${wattly.nems.base-url}
    enabled: ${USEP_POLLING_ENABLED:true}
    # Retry regularly: NEMS can publish a new half-hour price after the :02/:32 poll.
    cron: ${USEP_POLL_CRON:0 */5 * * * *}
    connect-timeout: 3s
    read-timeout: 5s
    stale-after: 40m
  # CSDT4-27: daily check for half-hours missing from market_price (also runs at startup).
  gaps:
    cron: ${PRICE_GAP_CRON:0 15 0 * * *}
    days: ${PRICE_GAP_DAYS:7}

# CSDT4-74: WATTLY_NEMS_BASE_URL overrides the NEMS URL; the older USEP_FEED_URL remains supported.
wattly:
  nems:
    base-url: ${WATTLY_NEMS_BASE_URL:${USEP_FEED_URL:https://nems.sn.sg/api/status.json}}

management:
  endpoints:
    web:
      exposure:
        include: health,info

weather:
  feed:
    url: ${NEA_FEED_URL:https://api-open.data.gov.sg/v2/real-time/api/two-hr-forecast}
    cron: ${NEA_POLL_CRON:0 2,32 * * * *}
  daily:
    url: ${NEA_DAILY_FEED_URL:https://api-open.data.gov.sg/v2/real-time/api/twenty-four-hr-forecast}
    enabled: ${NEA_DAILY_POLLING_ENABLED:${USEP_POLLING_ENABLED:true}}
    cron: ${NEA_DAILY_POLL_CRON:0 5 */3 * * *}
    stale-after: 6h
    heat-threshold-c: ${WEATHER_HEAT_THRESHOLD_C:33}

forecast:
  admin:
    local-basic-enabled: ${WATTLY_FORECAST_LOCAL_ADMIN_ENABLED:false}
    username: ${WATTLY_ADMIN_USER:}
    password: ${WATTLY_ADMIN_PASSWORD:}
  mode: ${FORECAST_MODE:LIVE}
  python-url: ${FORECAST_PYTHON_URL:http://127.0.0.1:8001}
  python-timeout: ${FORECAST_PYTHON_TIMEOUT:5s}
  # Leave empty until F1 documents an EMC comparison proving the existing floor rule.
  period-mapping-evidence: ${FORECAST_PERIOD_MAPPING_EVIDENCE:}
  import-file: ${FORECAST_IMPORT_FILE:}
  spike:
    minimum-samples: ${FORECAST_SPIKE_MINIMUM_SAMPLES:14}
    k: ${FORECAST_SPIKE_K:3}
    spread-floor: ${FORECAST_SPIKE_SPREAD_FLOOR:1}
    classification-band: ${FORECAST_CLASSIFICATION_BAND:1}

# F4 (CSDT4-19/20). Why demo is the default: docs/f4-recommendations.md
recommendation:
  forecast-source: ${RECOMMENDATION_FORECAST_SOURCE:demo}
  demo-replay-day: ${RECOMMENDATION_DEMO_REPLAY_DAY:2026-09-26}
  minimum-saving-sgd: ${RECOMMENDATION_MINIMUM_SAVING_SGD:0.05}
  # CSDT4-37: at most this many open suggestions per household, best saving first.
  max-active: ${RECOMMENDATION_MAX_ACTIVE:3}
  # CSDT4-37: recompute in the background (startup, new price, appliance change, this schedule).
  auto-recompute: ${RECOMMENDATION_AUTO_RECOMPUTE:true}
  recompute-cron: ${RECOMMENDATION_RECOMPUTE_CRON:0 1,31 * * * *}
  # A stale price feed always blocks F3-based suggestions; set true to block the demo forecast too.
  stale-feed-blocks-demo: ${RECOMMENDATION_STALE_FEED_BLOCKS_DEMO:false}
  # Mark spikes in the demo forecast with F3's rule (vs the 28 days before the replay day), so
  # "avoid this time" warnings can be shown (CSDT4-38). Needs that history in the database.
  demo-spikes: ${RECOMMENDATION_DEMO_SPIKES:true}

demo:
  replay:
    files: ${DEMO_REPLAY_FILES:data/replay/2026-09-25_data(backup_day).csv,data/replay/2026-09-26_data(main_day).csv}
